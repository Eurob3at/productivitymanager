<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Productivity App</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --text:#e4e7f2;--muted:#9aa2bd;--line:#343a4d;--card:#161a24;--accent:#8e9bff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;font-size:106.25%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse 55% 50% at 12% 18%,rgba(255,79,163,.42),transparent 68%),radial-gradient(ellipse 60% 55% at 88% 82%,rgba(25,211,200,.4),transparent 68%),linear-gradient(135deg,#2a1285,#0d3f94 55%,#08647c)}
body.space{background:radial-gradient(ellipse 60% 50% at 18% 22%,rgba(104,72,200,.24),transparent 70%),radial-gradient(ellipse 55% 45% at 82% 78%,rgba(30,126,170,.2),transparent 70%),#06080f}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,.b:focus-visible .in{outline:2px solid #ffc65c;outline-offset:3px;border-radius:6px}
#ttl{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none}
#ttl h1{font-weight:300;letter-spacing:.05em;font-size:clamp(1.15rem,3vw,1.6rem)}
.focus #ttl{display:none}
#stage{position:fixed;inset:0;z-index:0}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cb{z-index:1}#cf{z-index:13}
.b{position:absolute;left:0;top:0;border-radius:50%;cursor:pointer;z-index:2;will-change:transform;transition:opacity .5s}
.b.big{z-index:3;cursor:default}.b.small{z-index:12}.b.hz{z-index:2;pointer-events:none}.b.gone{opacity:0}
.in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%;
  background:linear-gradient(150deg,var(--lit),var(--c) 65%,var(--shade) 130%);border:1px solid rgba(255,255,255,.3);
  box-shadow:0 8px 30px rgba(0,0,0,.25),0 0 calc(var(--r) * (.15 + var(--g) * .9)) color-mix(in srgb,var(--c) 55%,transparent);
  transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.space .in{background:radial-gradient(circle at 28% 22%,var(--lit),var(--c) 30%,var(--shade) 72%);border-color:rgba(255,255,255,.12);
  box-shadow:inset calc(var(--r) * -.08) calc(var(--r) * -.1) calc(var(--r) * .3) rgba(0,0,0,.5),0 0 calc(var(--r) * (.3 + var(--g) * .9)) color-mix(in srgb,var(--c) calc(18% + var(--g) * 55%),transparent)}
.b:hover .in{transform:scale(1.04)}.b.big:hover .in,.b.hz .in{transform:none}
.lbl{font-weight:400;letter-spacing:.03em;font-size:max(10px,calc(var(--r) * .16));color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.big .lbl{font-size:max(16px,calc(var(--r) * .1))}.hz .lbl{display:none}
.small .in{padding:0}.small .lbl{font-size:calc(var(--r) * .45)}
.nonames .lbl{display:none}
.content{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.opts{display:flex;gap:10px}
.opt{width:calc(var(--r) * .6);height:calc(var(--r) * .6);border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.28);color:#fff;cursor:pointer;font:inherit;font-size:.85rem}
.opt:hover{border-color:#fff}
/* section page (inside the box) */
.jost{--ink:#eeebff;--dust:#a6aad8;--line2:rgba(238,235,255,.14);--void:#070a1c;--sun:#ffc65c;--gutter:clamp(1rem,4vw,3rem);
  font-family:Jost,Futura,"Century Gothic","URW Gothic","Avenir Next",system-ui,sans-serif;line-height:1.5;color:var(--ink)}
#page{position:fixed;left:0;right:0;bottom:0;top:var(--pt,0px);overflow:auto;z-index:10;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.focus #page{opacity:1;visibility:visible}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:none;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem 2rem;padding:1.25rem var(--gutter)}
.focus #bar{display:flex}
.brand{display:inline-flex;align-items:center;gap:.6rem;font-size:1.25rem;font-weight:600;letter-spacing:.03em;text-decoration:none}
.brand::before{content:"";width:.85rem;height:.85rem;border-radius:50%;background:var(--sun);box-shadow:0 0 14px rgba(255,198,92,.7)}
.hop{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;align-items:center}
#nav{display:contents}.noquick #nav{display:none}
.hop a{display:inline-flex;align-items:center;gap:.45rem;padding:.15rem 0;color:var(--dust);text-decoration:none;border-bottom:2px solid transparent}
.hop a:hover{color:var(--ink)}.hop a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--c)}
.dot{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.qs{background:none;border:1px solid var(--line2);color:var(--dust);border-radius:14px;padding:.1rem .7rem;font:inherit;font-size:.85rem;cursor:pointer}
.qs:hover{color:var(--ink)}
.section-page{max-width:calc(46rem + 2 * var(--gutter));padding:1rem var(--gutter) 3rem;margin-left:var(--rail,0px)}
.back{color:var(--dust);font-size:.95rem;text-underline-offset:3px}.back:hover{color:var(--ink)}
.section-page h1{margin-top:1.2rem;font-size:clamp(2.5rem,6vw,3.8rem);font-weight:500;line-height:1.05;letter-spacing:-.01em}
.lede{margin-top:.7rem;color:var(--dust);font-size:1.12rem}
.kinds{display:flex;gap:.6rem;margin-top:.9rem}
.kinds button{background:none;border:1px solid var(--line2);color:var(--dust);border-radius:1rem;padding:.2rem .9rem;font:inherit;cursor:pointer}
.kinds button[aria-pressed="true"]{color:var(--ink);border-color:var(--c)}
.group h2{margin-top:2.4rem;padding-bottom:.5rem;border-bottom:1px solid var(--c);font-size:1rem;font-weight:500;color:var(--ink)}
.item{display:grid;grid-template-columns:2.4rem minmax(0,1fr);align-items:start;padding:.95rem .5rem .95rem 0;border-bottom:1px solid var(--line2);scroll-margin-top:2rem}
.check{display:grid;place-items:center;width:1.5rem;height:1.5rem;margin-top:.1rem;padding:0;border:2px solid var(--c);border-radius:50%;background:transparent;cursor:pointer;transition:background .15s}
.check svg{width:.85rem;height:.85rem;fill:none;stroke:transparent;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.check:hover{background:color-mix(in srgb,var(--c) 30%,transparent)}.check:hover svg{stroke:var(--ink)}
.is-done .check{background:var(--c)}.is-done .check svg{stroke:var(--void)}
.item summary{display:grid;grid-template-columns:minmax(0,1fr) auto .6rem;gap:1.2rem;align-items:start;cursor:pointer;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"";width:.5rem;height:.5rem;margin-top:.45rem;border-right:2px solid var(--dust);border-bottom:2px solid var(--dust);transform:rotate(45deg);transition:transform .15s}
.item details[open] summary::after{transform:rotate(-135deg);margin-top:.7rem}
.item-title{display:block;font-weight:500;line-height:1.35}.item-meta{display:block;color:var(--dust);font-size:.95rem}
.item summary:hover .item-title{text-decoration:underline;text-decoration-color:var(--c);text-underline-offset:3px}
.item-time{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item-date{display:block;color:var(--dust);font-size:.95rem}
.item-more{padding:.6rem 0 .2rem;max-width:38rem}.item-source{margin-top:.3rem;color:var(--dust);font-size:.95rem}
.is-done .item-title{text-decoration:line-through;color:var(--dust)}.is-done .item-time{color:var(--dust)}
.empty{color:var(--dust);padding:1rem 0}
.foot{padding:1.5rem var(--gutter);color:var(--dust);font-size:.9rem;margin-left:var(--rail,0px)}
@media (max-width:700px){.item summary{gap:.7rem}}
/* dock and menus */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:30}
#dock button{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.85);backdrop-filter:blur(6px);color:var(--text);cursor:pointer;display:grid;place-items:center;font:inherit}
#dock button:hover,#dock button.on{border-color:var(--accent)}
#dock .pill{width:auto;border-radius:22px;padding:0 15px;font-size:.8rem}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#cnt{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#0f1115;font:500 10px/18px Sora,sans-serif;min-width:18px;height:18px;border-radius:9px;padding:0 3px;text-align:center}
#pop,#dev,#nbox,#mbox{background:rgba(18,22,34,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:16px;flex-direction:column;gap:10px;overflow:auto;color:var(--text)}
#pop,#dev,#nbox{position:fixed;display:none}
#pop{left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(360px,92vw);max-height:62vh;z-index:31}
#dev{left:16px;top:calc(72px + env(safe-area-inset-top,0px));width:260px;max-height:55vh;z-index:31}
#nbox{right:16px;top:calc(14px + env(safe-area-inset-top,0px));width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 100px);z-index:40;gap:12px}
.show{display:flex!important}
h3{font-weight:400;font-size:.95rem}.mut{color:var(--muted);font-size:.8rem}
.nh{display:flex;align-items:baseline;gap:10px}.nh .mut{flex:1}
.x2,.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
input[type=checkbox],input[type=range],input[type=radio]{accent-color:var(--accent)}
#dev label{display:grid;grid-template-columns:1fr 26px;gap:2px 8px;font-size:.8rem;color:var(--muted)}
#dev span{grid-column:1/-1}#dev input{width:100%}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,.n button,.row{background:#20242f;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 13px;cursor:pointer;font:inherit;font-size:.82rem}
.btn:hover,.n button:hover,.row:hover{border-color:var(--accent)}
.n{background:#1b1f2b;border:1px solid var(--line);border-radius:14px;padding:12px}
.n p{margin-bottom:10px;font-size:.88rem}.n input[type=range]{width:100%}.done{color:var(--muted);font-size:.85rem}
.row{display:grid;grid-template-columns:10px 1fr;gap:2px 10px;text-align:left;width:100%;margin-bottom:6px;padding:9px 12px}
.row i{width:10px;height:10px;border-radius:50%;margin-top:5px;grid-row:span 3}.row b{font-weight:500;font-size:.88rem}.row span{color:var(--muted);font-size:.78rem}
textarea,select{width:100%;background:#10131b;border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:.82rem;padding:9px;resize:vertical}
pre{margin:0;background:#10131b;border-radius:10px;padding:10px;font-size:.72rem;overflow:auto;max-height:200px;white-space:pre-wrap}
.drop{width:150px;height:150px;border-radius:50%;border:1px dashed var(--accent);margin:4px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:.82rem;color:var(--muted)}
.drop.over{background:rgba(142,155,255,.12)}
li.f{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;background:#10131b;border-radius:8px;padding:6px 10px;margin-bottom:6px}
li.f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li.f button{background:none;border:0;color:var(--muted);cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#mbox{position:relative;width:min(640px,100%);max-height:88vh;display:flex}
#mbox .x{position:absolute;top:8px;right:12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:6px;font-size:.88rem}.q label{display:flex;gap:8px;align-items:center;color:var(--text)}
details.ex summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.content{animation:none}}
</style>
</head>
<body class="space">
<header id="ttl"><h1>Productivity App</h1></header>
<div id="bar" class="jost"><a class="brand" href="#" id="brand">Productivity App</a><div class="hop" aria-label="Sections"><span id="nav"></span><button class="qs" id="qsb" aria-pressed="true">Quick switch</button></div></div>
<div id="stage"><canvas id="cb"></canvas><canvas id="cf"></canvas></div>
<div id="page" class="jost"></div>
<aside id="nbox" aria-label="Notifications"><div class="nh"><h3>Notifications</h3><span class="mut">Most important first</span><button class="x2" id="nx" aria-label="Close notifications">&times;</button></div><div id="nbody"></div></aside>
<div id="dev"><h3>Notification tester</h3></div>
<div id="pop"></div>
<div id="modal"><div id="mbox"></div></div>
<nav id="dock">
  <button id="bell" title="Notifications" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2v-4a4.5 4.5 0 0 0-9 0v4L6 17zM10 20h4"/></svg><i id="cnt">0</i></button>
  <button data-p="notes" title="Notes" aria-label="Notes"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM14 4v5h5M8 13h8M8 16h5"/></svg></button>
  <button data-p="cal" title="Calendar" aria-label="Calendar"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg></button>
  <button id="addbtn" title="Add a bubble" aria-label="Add a bubble"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button data-p="settings" title="Settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button>
  <button id="devbtn" class="pill">Dev</button>
</nav>
<script src="load-events.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- sample data (ported from the Flask version) ---------- */
const NOW=new Date();
const on=(d,h,m=0)=>{const t=new Date(NOW);t.setDate(t.getDate()+d);t.setHours(h,m,0,0);return t};
const fromNow=h=>{const t=new Date(NOW.getTime()+h*36e5);t.setMinutes(Math.floor(t.getMinutes()/15)*15,0,0);return t};
const sections=[
 {slug:'homework',name:'Homework',color:'#FF8A6B',verb:'Due',blurb:'Assignments from your Canvas courses.'},
 {slug:'si-sessions',name:'SI sessions',color:'#46D6C2',verb:'Starts',blurb:'Supplemental Instruction sessions for your classes.'},
 {slug:'events',name:'Events',color:'#B79BFF',verb:'Starts',blurb:'Club meetings and campus events found in your email.'},
 {slug:'exams',name:'Exams',color:'#F2668B',verb:'Starts',blurb:'Exams and quizzes from your course calendars.'},
 {slug:'messages',name:'Messages',color:'#6FB6FF',verb:'Received',blurb:'Emails that look like they need a reply.'},
 {slug:'announcements',name:'Announcements',color:'#9EDB7A',verb:'Posted',blurb:'Announcements your instructors posted on Canvas.'}];
const items=[
['hw-1','homework','Problem set 7: series and convergence','Calculus II',on(1,23,59),'','Canvas','Problems 1 to 14 from section 11.4. Upload one PDF.'],
['hw-2','homework','Lab 5 report: op-amp circuits','Intro to ECE',on(2,17),'','Canvas','Include the measured gain table and both oscilloscope captures.'],
['hw-3','homework','Reading response 4','College Writing',on(3,23,59),'','Canvas','About 400 words on this week’s two readings.'],
['hw-4','homework','Online homework 9: rotational motion','Physics I',on(4,23,59),'','Canvas','Twelve questions, three attempts each.'],
['hw-5','homework','Essay draft 2','College Writing',on(8,23,59),'','Canvas','Revised draft with the peer review comments addressed.'],
['si-1','si-sessions','Calculus II SI session','Calculus II',fromNow(3),'Library, room 1320','Calendar','Topic: ratio and root tests. Bring problem set 7.'],
['si-2','si-sessions','Physics I SI session','Physics I',on(1,18),'Science Hall 104','Calendar','Topic: torque and angular momentum.'],
['si-3','si-sessions','Calculus II exam review','Calculus II',on(3,19),'Library, room 1320','Calendar','Longer session covering everything since the last exam.'],
['ev-1','events','IEEE student chapter meeting','IEEE',on(1,19),'Engineering Lab 2, room 119','Gmail','Soldering workshop after a short general meeting.','fun'],
['ev-2','events','Engineering career fair','College of Engineering',on(2,10),'Campus Center','Gmail','Runs until 3:00 PM. Bring printed resumes.','important'],
['ev-3','events','Robotics club build night','Robotics club',on(5,18,30),'Makerspace','Gmail','Drivetrain assembly for the spring competition robot.','fun'],
['ex-1','exams','Quiz 8','Calculus II',on(2,9,5),'In class','Canvas','Covers sections 11.3 and 11.4. Twenty minutes.'],
['ex-2','exams','Midterm 2','Physics I',on(6,19),'Science Hall auditorium','Canvas','Chapters 7 to 10. One page of notes allowed.'],
['ex-3','exams','Lab practical','Intro to ECE',on(10,14,30),'Engineering Lab 1','Canvas','Build and measure a circuit from a schematic.'],
['ms-1','messages','Re: lab partner swap','Intro to ECE teaching assistant',fromNow(-2),'','Gmail','Asks you to confirm the new lab section by Friday.'],
['ms-2','messages','Group project meeting time?','College Writing group',fromNow(-6),'','Gmail','Your group wants to pick a time to meet this week.'],
['ms-3','messages','Advising appointment confirmation','Academic advising',on(-1,15,20),'','Gmail','Reply to confirm or pick another slot.'],
['an-1','announcements','Midterm 2 room change','Physics I',fromNow(-4),'','Canvas','The exam moved to the Science Hall auditorium.'],
['an-2','announcements','Thursday office hours moved','Calculus II',on(-1,11,45),'','Canvas','This week only, office hours are 2:00 to 3:30 PM.'],
['an-3','announcements','Lab 5 report template posted','Intro to ECE',on(-2,16,10),'','Canvas','Use the posted template for the report.']
].map(a=>({id:a[0],section:a[1],title:a[2],course:a[3],when:a[4],place:a[5],source:a[6],detail:a[7],kind:a[8]}));
const DONE=new Set();
const SEC=slug=>sections.find(s=>s.slug===slug);
const clock=d=>(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()<12?'AM':'PM');
const dateLabel=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const daysAway=d=>Math.round((sod(d)-sod(new Date()))/864e5);
const whenPhrase=(v,d)=>v+' '+({'-1':'yesterday','0':'today','1':'tomorrow'}[daysAway(d)]||dateLabel(d))+' at '+clock(d);
function groupName(d){const n=daysAway(d);if(n<-1)return'Earlier';if(n>7)return'Later';if(n>1)return'In the next week';return{'-1':'Yesterday','0':'Today','1':'Tomorrow'}[n]}
function mix(a,b,t){a=a.replace('#','');b=b.replace('#','');return'#'+[0,2,4].map(i=>Math.round(parseInt(a.substr(i,2),16)*(1-t)+parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('')}
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const openCount=slug=>items.filter(i=>i.section===slug&&!DONE.has(i.id)).length;
const enrich=it=>{const s=SEC(it.section),g=groupName(it.when);return{...it,done:DONE.has(it.id),group:g,phrase:whenPhrase(s.verb,it.when),clock:clock(it.when),date:['Earlier','In the next week','Later'].includes(g)?dateLabel(it.when):''}};
/* ---------- state ---------- */
const stage=$('stage'),cb=$('cb').getContext('2d'),cf=$('cf').getContext('2d');
let W=1,H=1,mt=64,mb=78,fh=1,cy=1,te=64,R=80,mode='home',fi=-1,evKind='fun',inited=false;
const opt={drift:true,orbits:true,names:true,space:true,colors:true,quick:true};
if(matchMedia('(prefers-reduced-motion: reduce)').matches)opt.drift=false;
const sc=c=>.86+.4*Math.min(c,20)/20;
const bodies=[];
function addBody(s){
  const i=bodies.length,el=document.createElement('div');
  el.className='b';el.title=s.name;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',s.name);
  el.style.setProperty('--c',s.color);el.style.setProperty('--g',0);
  el.innerHTML='<div class="in"><div class="lbl"></div><div class="content"></div></div>';
  stage.insertBefore(el,$('cf'));
  const b={sec:s,i,el,lbl:el.querySelector('.lbl'),con:el.querySelector('.content'),x:W/2+(Math.random()-.5)*W*.3,y:cy+(Math.random()-.5)*fh*.3,vx:0,vy:0,r:10,tr:10,tx:0,ty:0,

function bubblePrompt(desc){
  return 'You are helping design a new category bubble for "Productivity App", a student planner whose home screen is a cluster of planets. Each planet is one category holding a list of dated items.\n\nMy request: '+(desc.trim()||'(describe the bubble here)')+'\n\nReturn ONLY valid JSON (no prose, no code fences) in this shape:\n{\n  "slug": "kebab-case-id",\n  "name": "Short name in sentence case",\n  "color": "#RRGGBB accent, different from: '+sections.map(s=>s.color).join(', ')+'",\n  "verb": "Due | Starts | Received | Posted",\n  "blurb": "One sentence describing the category",\n  "items": [{"id":"unique-id","title":"...","course":"class or group","when":"YYYY-MM-DDTHH:MM local time","place":"","source":"Canvas | Gmail | Calendar","detail":"One line shown when expanded"}]\n}\nUse 3 to 6 realistic sample items within the next two weeks. If my request is unclear, pick sensible defaults and keep this structure.';
}
function addBubble(c){
  if(!c||!c.name||!/^#[0-9a-f]{6}$/i.test(c.color||''))throw new Error('The reply needs a name and a #RRGGBB color.');
  let slug=String(c.slug||c.name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'bubble';
  while(SEC(slug))slug+='-2';
  const s={slug,name:String(c.name),color:c.color,verb:['Due','Starts','Received','Posted'].includes(c.verb)?c.verb:'Starts',blurb:String(c.blurb||'')};
  sections.push(s);
  (c.items||[]).forEach((x,n)=>{let id=String(x.id||slug+'-'+(n+1)).replace(/[^\w-]/g,'');while(items.some(i=>i.id===id))id+='x';
    let w=new Date(x.when);if(isNaN(w))w=on(1,12);
    items.push({id,section:slug,title:String(x.title||'Untitled'),course:String(x.course||s.name),when:w,place:String(x.place||''),source:String(x.source||'Gemini'),detail:String(x.detail||'')})});
  addBody(s);syncCounts();buildDev();setMode('home');
}
function bubbleModal(){
  openModal('<h3>Add a bubble</h3><p class="mut">Describe it, copy the prompt into Gemini, then paste Gemini’s JSON reply below. Gemini finalizes the specifics.</p><label class="fl">What should this bubble track?<textarea id="bd" rows="2" placeholder="For example: study groups and tutoring office hours"></textarea></label><label class="fl">Model prompt<textarea id="bp" rows="7" readonly></textarea></label><div class="r"><button class="btn" id="bc">Copy prompt</button><span class="mut" id="bs"></span></div><details class="ex"><summary>Example code</summary><pre id="bx"></pre></details><label class="fl">Gemini’s reply (JSON)<textarea id="br" rows="5"></textarea></label><div class="r"><button class="btn" id="ba">Add bubble</button><button class="btn" id="be">Fill with example</button></div>');
  const d=$('bd'),p=$('bp');const upd=()=>p.value=bubblePrompt(d.value);upd();d.oninput=upd;
  $('bx').textContent=JSON.stringify(exampleBubble(),null,2)+'\n\n// The app reads the reply with:\naddBubble(JSON.parse(reply));';
  $('bc').onclick=()=>copyFrom(p,$('bs'));
  $('be').onclick=()=>$('br').value=JSON.stringify(exampleBubble(),null,2);
  $('ba').onclick=()=>{try{addBubble(JSON.parse($('br').value.replace(/```json|```/g,'').trim()));closeModal()}catch(e){$('bs').textContent='Could not add: '+e.message}};
}
$('addbtn').onclick=bubbleModal;
/* calendar export */
const icsEsc=s=>String(s).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function icsText(list,prefix){
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const ev=list.map(i=>{const s=SEC(i.section),len=i.section==='exams'?120:s.verb==='Due'?15:60;
    return['BEGIN:VEVENT','UID:'+i.id+'@productivity-app','DTSTAMP:'+f(new Date())+'','DTSTART:'+f(i.when),'DTEND:'+f(new Date(i.when.getTime()+len*6e4)),
      'SUMMARY:'+icsEsc((prefix?s.name+': ':'')+i.title),'DESCRIPTION:'+icsEsc(i.course+'. '+i.detail),'LOCATION:'+icsEsc(i.place),'END:VEVENT'].join('\r\n')});
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Productivity App//EN',...ev,'END:VCALENDAR'].join('\r\n');
}
function calModal(){
  openModal('<h3>Export your calendar</h3><p class="mut">Choose how you want it formatted. Gemini writes the file from your items, or copy a basic .ics now.</p><label class="fl">Format<select id="cx1"><option value="iCalendar (.ics)">iCalendar (.ics)</option><option value="CSV for Google Calendar">CSV for Google Calendar</option><option value="Plain-text agenda">Plain-text agenda</option></select></label><label class="fl">Include<select id="cx2"><option>Open items only</option><option>Everything, including done</option></select></label><label class="fl">Reminders<select id="cx3"><option>None</option><option>1 hour before</option><option>1 day before</option><option>1 day and 1 hour before</option></select></label><label class="fl">Anything else about the format<textarea id="cx4" rows="2" placeholder="For example: color-code by section, put the course first in titles"></textarea></label><label class="fl">Prompt for Gemini<textarea id="cp" rows="7" readonly></textarea></label><div class="r"><button class="btn" id="cc">Copy prompt</button><button class="btn" id="ci">Copy basic .ics</button><span class="mut" id="cs"></span></div>');
  const upd=()=>{const all=$('cx2').selectedIndex===1,list=items.filter(i=>all||!DONE.has(i.id)).map(i=>({title:i.title,section:SEC(i.section).name,course:i.course,start:iso(i.when),place:i.place,source:i.source,detail:i.detail,done:DONE.has(i.id)}));
    $('cp').value='You are exporting my Productivity App schedule to a calendar file.\nFormat: '+$('cx1').value+'\nInclude: '+$('cx2').value+'\nReminders: '+$('cx3').value+'\nExtra preferences: '+($('cx4').value.trim()||'none')+'\n\nUse my local time zone. Due dates last 15 minutes, sessions 1 hour, exams 2 hours. Return only the file contents, ready to save.\n\nItems:\n'+JSON.stringify(list,null,1)};
  ['cx1','cx2','cx3','cx4'].forEach(id=>$(id).oninput=upd);upd();
  $('cc').onclick=()=>copyFrom($('cp'),$('cs'));
  $('ci').onclick=async()=>{const t=icsText(items.filter(i=>$('cx2').selectedIndex===1||!DONE.has(i.id)),true);try{await navigator.clipboard.writeText(t);$('cs').textContent='Copied basic .ics.'}catch(e){$('cs').textContent='Clipboard blocked here.'}};
}
/* survey */
const survey={title:'Tune the app to you',questions:[
 {id:'first',text:'Which section do you check first each day?',type:'choice',options:sections.map(s=>s.name)},
 {id:'remind',text:'How early should reminders appear?',type:'choice',options:['The same day','1 day before','2 to 3 days before']},
 {id:'load',text:'How heavy does your week feel right now?',type:'scale',min:1,max:5},
 {id:'notes',text:'Anything else Gemini should know?',type:'text'}]};
const surveyAnswers={};// TODO: send to Gemini
function surveyForm(sv){
  return '<h3>'+esc(sv.title||'Survey')+'</h3>'+sv.questions.map(q=>{
    let h='<div class="q" data-id="'+esc(q.id)+'"><b style="font-weight:400">'+esc(q.text)+'</b>';
    if(q.type==='choice')h+=(q.options||[]).map(o=>'<label><input type="radio" name="'+esc(q.id)+'" value="'+esc(o)+'">'+esc(o)+'</label>').join('');
    else if(q.type==='scale'){h+='<div class="r">';for(let n=q.min||1;n<=(q.max||5);n++)h+='<label><input type="radio" name="'+esc(q.id)+'" value="'+n+'">'+n+'</label>';h+='</div>'}
    else h+='<textarea rows="2" name="'+esc(q.id)+'"></textarea>';
    return h+'</div>'}).join('')+'<div class="r"><button class="btn" id="ss">Save answers</button><span class="mut" id="sst"></span></div>';
}
function surveyModal(){
  const prompt='You are the personalization engine for "Productivity App". My sections: '+sections.map(s=>s.name+' ('+openCount(s.slug)+' open)').join(', ')+'. My earlier answers: '+JSON.stringify(surveyAnswers)+'.\nWrite a short survey (4 to 6 questions) that tells you how to format and prioritize the app for me. Return ONLY JSON: {"title":"...","questions":[{"id":"...","text":"...","type":"choice | scale | text","options":["..."],"min":1,"max":5}]}';
  const draw=sv=>{
    openModal('<div id="sf">'+surveyForm(sv)+'</div><details class="ex"><summary>Ask Gemini for a new survey</summary><label class="fl">Prompt<textarea id="sp" rows="5" readonly></textarea></label><div class="r"><button class="btn" id="sc">Copy prompt</button><span class="mut" id="sc2"></span></div><label class="fl">Gemini’s survey (JSON)<textarea id="sr" rows="4"></textarea></label><button class="btn" id="sl">Load survey</button></details>');
    $('sp').value=prompt;$('sc').onclick=()=>copyFrom($('sp'),$('sc2'));
    $('sl').onclick=()=>{try{const v=JSON.parse($('sr').value.replace(/```json|```/g,'').trim());if(!Array.isArray(v.questions))throw 0;draw(v)}catch(e){$('sc2').textContent='That reply is not a valid survey.'}};
    $('ss').onclick=()=>{sv.questions.forEach(q=>{const root=mbox.querySelector('.q[data-id="'+q.id+'"]');
      const v=q.type==='text'?root.querySelector('textarea').value:(root.querySelector('input:checked')||{}).value;if(v)surveyAnswers[q.id]=v});
      console.log('survey',surveyAnswers);$('sst').textContent='Saved.'};
  };
  draw(survey);
}
/* ---------- dev tool ---------- */
const dev=$('dev');
function buildDev(){
  dev.querySelectorAll('label,.r').forEach(n=>n.remove());
  bodies.forEach(b=>{
    const l=document.createElement('label');
    l.innerHTML='<span>'+esc(b.sec.name)+'</span><input type="range" min="0" max="40" value="'+b.count+'"><output>'+b.count+'</output>';
    l.querySelector('input').oninput=e=>{b.manual=+e.target.value;b.count=b.manual;l.querySelector('output').textContent=b.count};dev.appendChild(l);
  });
  const row=document.createElement('div');row.className='r';
  [['Random',()=>Math.floor(Math.random()*41)],['All 40',()=>40],['Auto',null]].forEach(([t,f])=>{
    const bt=document.createElement('button');bt.className='btn';bt.textContent=t;
    bt.onclick=()=>{bodies.forEach(b=>b.manual=f?f():null);syncCounts();buildDev()};row.appendChild(bt)});
  dev.appendChild(row);
}
$('devbtn').onclick=()=>dev.classList.toggle('show');
/* ---------- start ---------- */
layout();sections.forEach(addBody);syncCounts();buildDev();requestAnimationFrame(tick);
loadRealEvents(items);
</script>
