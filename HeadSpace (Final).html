<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HeadSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --text:#e4e7f2;--muted:#9aa2bd;--line:#343a4d;--card:#161a24;--accent:#8e9bff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;font-size:106.25%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse 55% 50% at 12% 18%,rgba(255,79,163,.42),transparent 68%),radial-gradient(ellipse 60% 55% at 88% 82%,rgba(25,211,200,.4),transparent 68%),linear-gradient(135deg,#2a1285,#0d3f94 55%,#08647c)}
body.space{background:radial-gradient(ellipse 60% 50% at 18% 22%,rgba(104,72,200,.24),transparent 70%),radial-gradient(ellipse 55% 45% at 82% 78%,rgba(30,126,170,.2),transparent 70%),#06080f}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,.b:focus-visible .in{outline:2px solid #ffc65c;outline-offset:3px;border-radius:6px}
#ttl{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none}
#ttl h1{font-weight:300;letter-spacing:.05em;font-size:clamp(1.15rem,3vw,1.6rem)}
.focus #ttl{display:none}
#stage{position:fixed;inset:0;z-index:0}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cb{z-index:1}#cf{z-index:13}
.b{position:absolute;left:0;top:0;border-radius:50%;cursor:pointer;z-index:2;will-change:transform;transition:opacity .5s}
.b.big{z-index:3;cursor:default}.b.small{z-index:12}.b.hz{z-index:2;pointer-events:none}.b.gone{opacity:0}
.in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%;
  background:linear-gradient(150deg,var(--lit),var(--c) 65%,var(--shade) 130%);border:1px solid rgba(255,255,255,.3);
  box-shadow:0 8px 30px rgba(0,0,0,.25),0 0 calc(var(--r) * (.15 + var(--g) * .9)) color-mix(in srgb,var(--c) 55%,transparent);
  transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.space .in{background:radial-gradient(circle at 28% 22%,var(--lit),var(--c) 30%,var(--shade) 72%);border-color:rgba(255,255,255,.12);
  box-shadow:inset calc(var(--r) * -.08) calc(var(--r) * -.1) calc(var(--r) * .3) rgba(0,0,0,.5),0 0 calc(var(--r) * (.3 + var(--g) * .9)) color-mix(in srgb,var(--c) calc(18% + var(--g) * 55%),transparent)}
.b:hover .in{transform:scale(1.04)}.b.big:hover .in,.b.hz .in{transform:none}
.lbl{font-weight:400;letter-spacing:.03em;font-size:max(10px,calc(var(--r) * .16));color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.big .lbl{font-size:max(16px,calc(var(--r) * .1))}.hz .lbl{display:none}
.small .in{padding:0}.small .lbl{font-size:calc(var(--r) * .45)}
.nonames .lbl{display:none}
.content{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.opts{display:flex;gap:10px}
.opt{width:calc(var(--r) * .6);height:calc(var(--r) * .6);border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.28);color:#fff;cursor:pointer;font:inherit;font-size:.85rem}
.opt:hover{border-color:#fff}
/* section page (inside the box) */
.jost{--ink:#eeebff;--dust:#a6aad8;--line2:rgba(238,235,255,.14);--void:#070a1c;--sun:#ffc65c;--gutter:clamp(1rem,4vw,3rem);
  font-family:Jost,Futura,"Century Gothic","URW Gothic","Avenir Next",system-ui,sans-serif;line-height:1.5;color:var(--ink)}
#page{position:fixed;left:0;right:0;bottom:0;top:var(--pt,0px);overflow:auto;z-index:10;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.focus #page{opacity:1;visibility:visible}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:none;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem 2rem;padding:1.25rem var(--gutter)}
.focus #bar{display:flex}
.brand{display:inline-flex;align-items:center;gap:.6rem;font-size:1.25rem;font-weight:600;letter-spacing:.03em;text-decoration:none}
.brand::before{content:"";width:.85rem;height:.85rem;border-radius:50%;background:var(--sun);box-shadow:0 0 14px rgba(255,198,92,.7)}
.hop{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;align-items:center}
#nav{display:contents}.noquick #nav{display:none}
.hop a{display:inline-flex;align-items:center;gap:.45rem;padding:.15rem 0;color:var(--dust);text-decoration:none;border-bottom:2px solid transparent}
.hop a:hover{color:var(--ink)}.hop a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--c)}
.dot{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.qs{background:none;border:1px solid var(--line2);color:var(--dust);border-radius:14px;padding:.1rem .7rem;font:inherit;font-size:.85rem;cursor:pointer}
.qs:hover{color:var(--ink)}
.section-page{max-width:calc(46rem + 2 * var(--gutter));padding:1rem var(--gutter) 3rem;margin-left:var(--rail,0px)}
.back{color:var(--dust);font-size:.95rem;text-underline-offset:3px}.back:hover{color:var(--ink)}
.section-page h1{margin-top:1.2rem;font-size:clamp(2.5rem,6vw,3.8rem);font-weight:500;line-height:1.05;letter-spacing:-.01em}
.lede{margin-top:.7rem;color:var(--dust);font-size:1.12rem}
.kinds{display:flex;gap:.6rem;margin-top:.9rem}
.kinds button{background:none;border:1px solid var(--line2);color:var(--dust);border-radius:1rem;padding:.2rem .9rem;font:inherit;cursor:pointer}
.kinds button[aria-pressed="true"]{color:var(--ink);border-color:var(--c)}
.group h2{margin-top:2.4rem;padding-bottom:.5rem;border-bottom:1px solid var(--c);font-size:1rem;font-weight:500;color:var(--ink)}
.item{display:grid;grid-template-columns:2.4rem minmax(0,1fr);align-items:start;padding:.95rem .5rem .95rem 0;border-bottom:1px solid var(--line2);scroll-margin-top:2rem}
.check{display:grid;place-items:center;width:1.5rem;height:1.5rem;margin-top:.1rem;padding:0;border:2px solid var(--c);border-radius:50%;background:transparent;cursor:pointer;transition:background .15s}
.check svg{width:.85rem;height:.85rem;fill:none;stroke:transparent;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.check:hover{background:color-mix(in srgb,var(--c) 30%,transparent)}.check:hover svg{stroke:var(--ink)}
.is-done .check{background:var(--c)}.is-done .check svg{stroke:var(--void)}
.item summary{display:grid;grid-template-columns:minmax(0,1fr) auto .6rem;gap:1.2rem;align-items:start;cursor:pointer;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"";width:.5rem;height:.5rem;margin-top:.45rem;border-right:2px solid var(--dust);border-bottom:2px solid var(--dust);transform:rotate(45deg);transition:transform .15s}
.item details[open] summary::after{transform:rotate(-135deg);margin-top:.7rem}
.item-title{display:block;font-weight:500;line-height:1.35}.item-meta{display:block;color:var(--dust);font-size:.95rem}
.item summary:hover .item-title{text-decoration:underline;text-decoration-color:var(--c);text-underline-offset:3px}
.item-time{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item-date{display:block;color:var(--dust);font-size:.95rem}
.item-more{padding:.6rem 0 .2rem;max-width:38rem}.item-source{margin-top:.3rem;color:var(--dust);font-size:.95rem}
.is-done .item-title{text-decoration:line-through;color:var(--dust)}.is-done .item-time{color:var(--dust)}
.empty{color:var(--dust);padding:1rem 0}
.foot{padding:1.5rem var(--gutter);color:var(--dust);font-size:.9rem;margin-left:var(--rail,0px)}
@media (max-width:700px){.item summary{gap:.7rem}}
/* dock and menus */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:30}
#dock button{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,34,.85);backdrop-filter:blur(6px);color:var(--text);cursor:pointer;display:grid;place-items:center;font:inherit}
#dock button:hover,#dock button.on{border-color:var(--accent)}
#dock .pill{width:auto;border-radius:22px;padding:0 15px;font-size:.8rem}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#cnt{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#0f1115;font:500 10px/18px Sora,sans-serif;min-width:18px;height:18px;border-radius:9px;padding:0 3px;text-align:center}
#pop,#dev,#nbox,#mbox{background:rgba(18,22,34,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:16px;flex-direction:column;gap:10px;overflow:auto;color:var(--text)}
#pop,#dev,#nbox{position:fixed;display:none}
#pop{left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(360px,92vw);max-height:62vh;z-index:31}
#dev{left:16px;top:calc(72px + env(safe-area-inset-top,0px));width:280px;max-height:70vh;z-index:31}
#nbox{right:16px;top:calc(14px + env(safe-area-inset-top,0px));width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 100px);z-index:40;gap:12px}
.show{display:flex!important}
h3{font-weight:400;font-size:.95rem}.mut{color:var(--muted);font-size:.8rem}
.nh{display:flex;align-items:baseline;gap:10px}.nh .mut{flex:1}
.x2,.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
input[type=checkbox],input[type=range],input[type=radio]{accent-color:var(--accent)}
#dev label{display:grid;grid-template-columns:1fr 26px;gap:2px 8px;font-size:.8rem;color:var(--muted)}
#dev span{grid-column:1/-1}#dev input{width:100%}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,.n button,.row{background:#20242f;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 13px;cursor:pointer;font:inherit;font-size:.82rem}
.btn:hover,.n button:hover,.row:hover{border-color:var(--accent)}
.n{background:#1b1f2b;border:1px solid var(--line);border-radius:14px;padding:12px}
.n p{margin-bottom:10px;font-size:.88rem}.n input[type=range]{width:100%}.done{color:var(--muted);font-size:.85rem}
.row{display:grid;grid-template-columns:10px 1fr;gap:2px 10px;text-align:left;width:100%;margin-bottom:6px;padding:9px 12px}
.row i{width:10px;height:10px;border-radius:50%;margin-top:5px;grid-row:span 3}.row b{font-weight:500;font-size:.88rem}.row span{color:var(--muted);font-size:.78rem}
textarea,select{width:100%;background:#10131b;border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:.82rem;padding:9px;resize:vertical}
pre{margin:0;background:#10131b;border-radius:10px;padding:10px;font-size:.72rem;overflow:auto;max-height:200px;white-space:pre-wrap}
.drop{width:150px;height:150px;border-radius:50%;border:1px dashed var(--accent);margin:4px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:.82rem;color:var(--muted)}
.drop.over{background:rgba(142,155,255,.12)}
li.f{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;background:#10131b;border-radius:8px;padding:6px 10px;margin-bottom:6px}
li.f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li.f button{background:none;border:0;color:var(--muted);cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#mbox{position:relative;width:min(640px,100%);max-height:88vh;display:flex}
#mbox .x{position:absolute;top:8px;right:12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:6px;font-size:.88rem}.q label{display:flex;gap:8px;align-items:center;color:var(--text)}
details.ex summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.content{animation:none}}
/* click the group of planets to go back */
#cluster{position:fixed;display:none;z-index:11;background:none;border:0;cursor:pointer;padding:0;color:#a6aad8}
.focus #cluster{display:block}
#cluster span{position:absolute;left:0;right:0;bottom:-1.5rem;text-align:center;font:400 .85rem Jost,Futura,"Century Gothic",system-ui,sans-serif}
#cluster:hover span{color:#eeebff}
@media (max-width:999px){#cluster span{display:none}}
/* past work rows on a section page */
.is-past .check{background:var(--c);cursor:default}.is-past .check svg{stroke:var(--void)}
/* new-notification pop-ups, top right */
#toasts{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:45;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 32px))}
.toast{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:rgba(18,22,34,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-left:3px solid var(--c,var(--accent));border-radius:14px;padding:12px 14px;animation:rise .5s ease both}
.tag{justify-self:start;font-size:.7rem;color:#0f1115;background:var(--accent);border-radius:8px;padding:1px 8px}
.toast b{grid-column:1/-1;font-weight:500;font-size:.9rem}.toast p{grid-column:1/-1;font-size:.8rem;color:var(--muted)}.toast .r{grid-column:1/-1;margin-top:4px}
.row.fresh{border-color:var(--accent)}.row .tag{grid-column:2;margin-bottom:2px;color:#0f1115;font-size:.7rem}
/* settings window: larger, with tabs */
#mbox.wide{width:min(860px,100%);height:min(640px,88vh)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{background:none;border:1px solid transparent;color:var(--muted);border-radius:10px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent);background:#20242f}
.pane{display:flex;flex-direction:column;gap:12px;padding-top:4px}
h4{margin:8px 0 0;font-weight:500;font-size:.85rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 24px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem}
.crow .dot{margin-right:.5rem}
input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
input[type=text],input[type=password],input[type=url]{width:100%;background:#10131b;border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:.82rem;padding:9px}
.prow{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;font-size:.85rem}
.pane select{width:auto;min-width:200px}
/* grades window */
.gpa{display:flex;align-items:baseline;gap:14px}.gpa b{font-weight:300;font-size:2.6rem}
.course{background:#1b1f2b;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.course summary{display:grid;grid-template-columns:1fr auto 2.2rem;gap:6px 14px;align-items:center;cursor:pointer;font-size:.9rem;list-style:none}
.course summary::-webkit-details-marker{display:none}
.course summary b{font-weight:500;text-align:right}
.meter{grid-column:1/-1;height:4px;border-radius:2px;background:#10131b;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.course ul{margin-top:10px}
.course li{display:grid;grid-template-columns:1fr auto 4.5rem;gap:12px;font-size:.8rem;color:var(--muted);padding:6px 0;border-top:1px solid var(--line)}
.course li span:first-child{color:var(--text)}.course li span:last-child{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
/* notifications window cards */
.n b{display:block;font-weight:500;font-size:.9rem;margin:4px 0 2px}
.btn[aria-pressed="true"]{border-color:var(--accent);background:#2a3044}
.btn:disabled{opacity:.4;cursor:default}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 38px auto auto;gap:8px;align-items:center}
@media (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr) 38px}}
/* events page: find more events, saved for later */
.find{display:flex;gap:.7rem;align-items:flex-end;flex-wrap:wrap;margin-top:1.4rem}
.find label{flex:1;min-width:14rem;display:flex;flex-direction:column;gap:.3rem;color:var(--dust);font-size:.95rem}
.find input{width:100%;background:rgba(238,235,255,.06);border:1px solid var(--line2);border-radius:.8rem;color:var(--ink);font:inherit;padding:.5rem .8rem}
.find button,.btn2{background:none;border:1px solid var(--c,#ffc65c);color:var(--ink,#eeebff);border-radius:1rem;padding:.45rem 1.1rem;font:inherit;cursor:pointer}
.find button:hover,.btn2:hover{background:color-mix(in srgb,var(--c,#ffc65c) 22%,transparent)}
.starc{border:0!important;background:none!important;color:var(--c);font-size:1.2rem;line-height:1;cursor:default!important}
/* event swipes */
#disc{position:fixed;inset:0;z-index:20;display:none}
.discover #disc{display:block}.discover #ttl{display:none}
.b.bg{opacity:.4;pointer-events:none}
.side{position:absolute;top:0;bottom:0;width:50%;border:0;background:none;color:var(--dust);cursor:pointer;font:inherit;font-size:1.05rem;font-weight:500;display:flex;align-items:center;padding:0 clamp(1rem,5vw,4rem);transition:background .2s,color .2s}
.side.l{left:0;justify-content:flex-start}.side.r{right:0;justify-content:flex-end}
.side.l:hover{background:linear-gradient(90deg,rgba(242,102,139,.18),transparent 55%);color:var(--ink)}
.side.r:hover{background:linear-gradient(270deg,rgba(70,214,194,.18),transparent 55%);color:var(--ink)}
#dtop{position:absolute;top:calc(1.25rem + env(safe-area-inset-top,0px));left:var(--gutter);right:var(--gutter);display:flex;justify-content:space-between;align-items:center;color:var(--dust);pointer-events:none}
#dtop button{pointer-events:auto}
#dcard{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:min(430px,84vw)}
.dc{display:flex;flex-direction:column;gap:.45rem;background:rgba(18,22,44,.93);backdrop-filter:blur(10px);border:1px solid var(--line2);border-top:3px solid var(--c,#b79bff);border-radius:22px;padding:1.4rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.dc .tag{align-self:flex-start}
.dc h2{font-size:1.6rem;font-weight:500;line-height:1.15;margin:.3rem 0 0}
.dust{color:var(--dust)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}.chips span{border:1px solid var(--line2);border-radius:1rem;padding:.05rem .65rem;font-size:.85rem;color:var(--dust)}
.dstar{align-self:flex-start;margin-top:.6rem;display:inline-flex;gap:.45rem;align-items:center;background:none;border:1px solid var(--line2);color:var(--ink);border-radius:1rem;padding:.3rem .9rem;font:inherit;cursor:pointer}
.dstar:hover{border-color:var(--sun);color:var(--sun)}
.dhint{color:var(--dust);font-size:.85rem;margin-top:.4rem}
.spark{position:absolute;left:50%;top:43%;width:9px;height:9px;border-radius:50%;background:#ffe08a;box-shadow:0 0 10px #ffc65c;pointer-events:none}
/* season themes: background */
body.t-spring{background:radial-gradient(ellipse 60% 50% at 15% 20%,rgba(255,143,186,.24),transparent 70%),radial-gradient(ellipse 55% 45% at 85% 80%,rgba(120,210,140,.2),transparent 70%),#0c1712}
body.t-summer{background:radial-gradient(ellipse 60% 50% at 80% 12%,rgba(255,190,80,.3),transparent 70%),radial-gradient(ellipse 60% 50% at 15% 90%,rgba(40,170,200,.26),transparent 70%),#081a2a}
body.t-fall{background:radial-gradient(ellipse 60% 50% at 18% 18%,rgba(230,120,40,.28),transparent 70%),radial-gradient(ellipse 55% 45% at 85% 82%,rgba(170,50,40,.24),transparent 70%),#170d08}
body.t-winter{background:radial-gradient(ellipse 60% 50% at 20% 15%,rgba(170,210,255,.24),transparent 70%),radial-gradient(ellipse 55% 45% at 82% 85%,rgba(220,235,255,.15),transparent 70%),#0a121d}
/* season themes: bubbles */

<script>

/* =====================================================================
   INTEGRATION GUIDE  (read this first if you are connecting Gemini)
   =====================================================================
   There are two named objects. Everything Gemini-related goes through them.

   1) GEMINI  = how the app talks TO Gemini
      GEMINI.endpoint        Put your backend URL here (for example '/api/gemini').
                             While it is empty, the app is in demo mode and uses
                             the model code below instead of calling Gemini.
      GEMINI.send(task,prompt)  The ONE place a request leaves the app. It POSTs
                             {task, prompt} to GEMINI.endpoint and expects
                             {text: "..."} back. Replace its body if your
                             backend works differently.
      GEMINI.prompts.<task>(input)  Builds the hidden prompt for a task. The
                             user never sees these. Every prompt includes the
                             model code, so replies always come back in the
                             same shape.
      GEMINI.models.<task>(input)   The model code: an example of a perfect
                             reply for that task. Used inside the prompt, and
                             used as the reply itself in demo mode.
      GEMINI.run(task,input) Builds the prompt, sends it, parses the reply.
                             Returns {live, data}. live=false means demo mode.

      The four tasks:
        'bubble'    Bubble Builder     -> reply is a Bubble     -> PA.addBubble(data)
        'notices'   Notice Writer      -> reply is Notice[]     -> PA.notify(each)
        'survey'    Survey Writer      -> reply is a Survey     -> PA.loadSurvey(data)
        'calendar'  Calendar Exporter  -> reply is file text    -> downloaded
        'discover'  Event Scout        -> reply is Event[]      -> PA.offerEvents(data)
      GEMINI.models.popup()  The model for ONE temporary pop-up (top right corner).

   2) PA  = how anything (Gemini, a backend, the console) changes the app
      PA.notify(notice)          Notice: pop-up in the top right corner, also
                                 listed under "New" in the notifications panel.
                                 {id, title, body, itemId?, section?}
      PA.askCheckIn(checkIn)     Check-in: a quick question card in the
                                 notifications panel.
                                 {id, question, type:'buttons'|'slider'|'survey', choices?}
      PA.loadSurvey(survey)      Survey: opens the survey window.
                                 {title, questions:[{id,text,type:'choice'|'scale'|'text',options?,min?,max?}]}
      PA.addBubble(bubble)       Bubble: a new planet with its own page.
                                 {slug,name,color,verb,blurb,items:[Item]}
      PA.addItems(items)         Item: one thing on a planet's page.
                                 {id,section,title,course,when,place,source,detail}
      PA.setGrades(gradebook)    Gradebook: courses and past graded work.
                                 {courses:[{name,credits,percent?}], past:[PastItem]}
                                 PastItem = {id,section,title,course,when,score,points,detail}
      PA.setPlanetColor(slug,color)   Recolor a planet ('#RRGGBB').
      PA.setPriority(slug,weight)     0 to 40. Higher shows first in notifications.
      PA.setCanvasToken(url,token) / PA.getCanvasToken()
                                 The Canvas access token typed in Settings.
                                 Kept in memory only. Never log it or send it
                                 anywhere except your own backend.
      PA.getState()              Snapshot of everything Gemini needs to know:
                                 sections, open items, grades, GPA, preferences
                                 and every answer the user has given.
      PA.report(type,data)       Called BY the app whenever the user answers
                                 something. Types: 'checkin', 'survey', 'note',
                                 'files', 'canvas'. Everything is kept in
                                 PA.outbox. Set PA.onReport = fn to receive
                                 each one as it happens.

      --- added in this version ---
      SUGGESTION                 A Notice that carries "actions": buttons that ask
                                 the user something. Send ONLY the actions that fit
                                 the new data. The action names (see ACTIONS):
                                   'add'         Add to my schedule
                                   'interested'  I'm interested (saves it for later)
                                   'star'        Save for later
                                   'start'       Start it now (opens the item)
                                   'remind'      Remind me later
                                   'dismiss'     Not interested
                                 Example: PA.notify({title, body, section:'si-sessions',
                                   item:{...new Item...}, actions:['add','dismiss']})
                                 "item" = new data not on a planet yet.
                                 "itemId" = an item that is already on a planet.
      POP-UP                     Any Notice shows as a temporary pop-up in the top
                                 right corner. "seconds" sets how long it stays.
      PA.offerEvents(events)     Event: a card for the swipe screen.
                                 {id,title,course,when,place,detail,tags:[],kind:'fun'|'important'}
      PA.startSwipes(kind,words) Opens the swipe screen (the Event Scout's results).
      PA.setTheme(name)          'space','aurora','spring','summer','fall','winter'
      PA.renamePlanet(slug,name) Rename a planet.
      PA.setPlanetPhoto(slug,url) / PA.setBackgroundPhoto(url)   '' removes it.
      Settings > Notifications is stored in nprefs and included in PA.getState()
      as "notifications". Do not send what the user turned off.
      More PA.report types: 'suggestion' {id,action} and 'swipe' {id,title,kind,choice}.

   Try it from the browser console:
      PA.notify({title:'Quiz 8 moved', body:'Now on Tuesday.', itemId:'ex-1'})
   ===================================================================== */

/* ---------- gradebook: courses and past graded work (sample data) ----------
   Replace with real Canvas data by calling PA.setGrades({courses, past}).
   A course grade is points earned / points possible across its graded past
   work, unless the course has its own `percent` (Canvas's current score). */
let courses=[
 {name:'Calculus II',credits:4},{name:'Physics I',credits:4},{name:'Intro to ECE',credits:4},{name:'College Writing',credits:3}];
let past=[
['pa-1','homework','Problem set 6: integration techniques','Calculus II',on(-6,23,59),46,50,'Sections 7.1 to 7.4.'],
['pa-2','homework','Problem set 5: applications of integrals','Calculus II',on(-13,23,59),44,50,'Sections 6.1 to 6.5.'],
['pa-3','exams','Quiz 7','Calculus II',on(-5,9,5),18,20,'Covered sections 11.1 and 11.2.'],
['pa-4','exams','Midterm 1','Calculus II',on(-20,19),84,100,'Chapters 6 and 7.'],

['pa-6','homework','Online homework 7: work and energy','Physics I',on(-10,23,59),30,30,'Ten questions.'],
['pa-7','exams','Midterm 1','Physics I',on(-22,19),78,100,'Chapters 1 to 6.'],
['pa-8','homework','Lab 4 report: RC circuits','Intro to ECE',on(-7,17),47,50,'Time constant measurements.'],
['pa-9','homework','Lab 3 report: voltage dividers','Intro to ECE',on(-14,17),45,50,'Measured against calculated values.'],
['pa-10','exams','Quiz 3','Intro to ECE',on(-9,14,30),9,10,'Kirchhoff’s laws.'],
['pa-11','homework','Essay draft 1','College Writing',on(-12,23,59),88,100,'First full draft.'],
['pa-12','homework','Reading response 2','College Writing',on(-11,23,59),10,10,'About 400 words.'],
['pa-13','homework','Reading response 3','College Writing',on(-4,23,59),null,10,'About 400 words.']
].map(a=>({id:a[0],section:a[1],title:a[2],course:a[3],when:a[4],score:a[5],points:a[6],detail:a[7]}));
/* percent floor, letter, grade points (standard 4.0 scale) */
const LETTERS=[[93,'A',4],[90,'A-',3.7],[87,'B+',3.3],[83,'B',3],[80,'B-',2.7],[77,'C+',2.3],[73,'C',2],[70,'C-',1.7],[67,'D+',1.3],[60,'D',1],[0,'F',0]];
function courseGrade(c){
  let pct=c.percent;
  if(pct==null){const g=past.filter(p=>p.course===c.name&&p.score!=null);if(!g.length)return null;
    pct=100*g.reduce((a,p)=>a+p.score,0)/g.reduce((a,p)=>a+p.points,0)}
  const L=LETTERS.find(l=>pct>=l[0])||LETTERS[LETTERS.length-1];
  return{pct,letter:L[1],gp:L[2]};
}
function gpa(){let q=0,cr=0;courses.forEach(c=>{const g=courseGrade(c);if(g){q+=g.gp*c.credits;cr+=c.credits}});return cr?q/cr:null}
const DONE=new Set();
const SEC=slug=>sections.find(s=>s.slug===slug);
const clock=d=>(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()<12?'AM':'PM');
const dateLabel=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const daysAway=d=>Math.round((sod(d)-sod(new Date()))/864e5);
const whenPhrase=(v,d)=>v+' '+({'-1':'yesterday','0':'today','1':'tomorrow'}[daysAway(d)]||dateLabel(d))+' at '+clock(d);
function groupName(d){const n=daysAway(d);if(n<-1)return'Earlier';if(n>7)return'Later';if(n>1)return'In the next week';return{'-1':'Yesterday','0':'Today','1':'Tomorrow'}[n]}
function mix(a,b,t){a=a.replace('#','');b=b.replace('#','');return'#'+[0,2,4].map(i=>Math.round(parseInt(a.substr(i,2),16)*(1-t)+parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('')}
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const openCount=slug=>items.filter(i=>i.section===slug&&!DONE.has(i.id)).length;
const enrich=it=>{const s=SEC(it.section),g=groupName(it.when);return{...it,done:DONE.has(it.id),group:g,phrase:whenPhrase(s.verb,it.when),clock:clock(it.when),date:['Earlier','In the next week','Later'].includes(g)?dateLabel(it.when):''}};
/* ---------- state ---------- */
const stage=$('stage'),cb=$('cb').getContext('2d'),cf=$('cf').getContext('2d');
let W=1,H=1,mt=64,mb=78,fh=1,cy=1,te=64,R=80,mode='home',fi=-1,evKind='fun',inited=false;
const opt={momentum:1,drift:true,orbits:true,names:true,space:true,colors:true,quick:true,skipIntro:false,devButton:true,hidden:[]};
let theme='space'; // current theme; change it with setTheme (Settings > Visual)
if(matchMedia('(prefers-reduced-motion: reduce)').matches)opt.drift=false;
const sc=c=>.86+.4*Math.min(c,20)/20;
const bodies=[];
function addBody(s){
  const i=bodies.length,el=document.createElement('div');
  el.className='b';el.title=s.name;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',s.name);
  el.style.setProperty('--c',s.color);el.style.setProperty('--g',0);
  el.innerHTML='<div class="in"><div class="lbl"></div><span class="planet-count" aria-hidden="true"></span><div class="content"></div></div>';
  stage.insertBefore(el,$('cf'));
  const b={sec:s,i,el,lbl:el.querySelector('.lbl'),con:el.querySelector('.content'),x:W/2+(Math.random()-.5)*W*.3,y:cy+(Math.random()-.5)*fh*.3,vx:0,vy:0,r:10,tr:10,tx:0,ty:0,
    ph:Math.random()*100,glow:0,gs:0,manual:null,count:0,key:'',dot:rgb(mix(s.color,'#ffffff',.45)),rgb:rgb(s.color)};
  b.lbl.textContent=s.name;
  el.onclick=()=>click(b);el.onkeydown=e=>{if(e.key==='Enter')click(b)};
  bodies.push(b);return b;
}
function syncCounts() {
  // One count model drives every surface. Dev overrides are only a visual preview.
  const active = notificationRecords().filter(record => !record.closed);
  bodies.forEach(body => {
    const count = active.filter(record => record.section === body.sec.slug).length;
    body.count = body.manual ?? count;
    body.el.querySelector('.planet-count').textContent = String(body.count);
    body.el.setAttribute('aria-label', body.sec.name + ', ' + body.count + ' notifications');
  });
  const total = active.length;
  $('cnt').textContent = String(total);
  document.title = 'HeadSpace (' + total + ')';
  $('brand').textContent = 'HeadSpace';
  bellMark();
}

const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),z:Math.random()*.9+.1,p:Math.random()*6}));
function layout(){
  W=innerWidth;H=innerHeight;
  const cs=getComputedStyle(document.documentElement);
  mt=64+(parseFloat(cs.paddingTop)||0);mb=78+(parseFloat(cs.paddingBottom)||0);
  fh=H-mt-mb;cy=mt+fh/2;
  const d=devicePixelRatio||1;
  [['cb',cb],['cf',cf]].forEach(([id,c])=>{const e=$(id);e.width=W*d;e.height=H*d;c.setTransform(d,0,0,d,0,0)});
  focusLayout();
}
function focusLayout(){
  te=mode==='focus'?Math.max(mt,$('bar').getBoundingClientRect().bottom):mt;
  const wide=W>=1000,pg=$('page');
  pg.style.setProperty('--pt',(te+(wide?0:128))+'px');pg.style.setProperty('--rail',wide?'250px':'0px');
  bodies.forEach(b=>b.el.classList.toggle('gone',mode==='focus'&&b.i===fi&&W<900));
  // the invisible "back to all planets" button covers the area the small planets float in
  if(['focus','discover','recommend'].includes(mode)){const c=$('cluster'),bd=bounds();c.style.left=bd.x0+'px';c.style.top=bd.y0+'px';c.style.width=(bd.x1-bd.x0)+'px';c.style.height=(bd.y1-bd.y0)+'px'}
}
function calcR(){
  const s2=bodies.filter(b=>!hidden(b)).reduce((a,b)=>a+sc(b.count)**2,0)||1;
  R=Math.min(Math.sqrt(.27*W*fh/(Math.PI*s2)),Math.min(W,fh)*.22);
}
function bounds(){
  if(mode==='focus')return W>=1000?{x0:12,x1:250,y0:te+8,y1:te+330}:{x0:12,x1:Math.min(W-12,320),y0:te+4,y1:te+124};
  if(mode==='discover'||mode==='recommend')return{x0:12,x1:Math.min(W-12,224),y0:66,y1:170}; // visible return-to-planets cluster
  return{x0:20,x1:W-20,y0:mt+8,y1:H-mb};
}
function targets(){
  const m=Math.min(W,fh);
  bodies.forEach(b=>{
    const g=1+.12*b.glow;
    if(mode==='home')b.tr=R*sc(b.count)*g;
    else if(mode==='events'){b.tr=b.i===fi?m*.27:R*sc(b.count)*.75*g;if(b.i===fi){b.tx=W/2;b.ty=cy}}
    else if(mode==='discover'||mode==='recommend'){if(b.i===fi){const z=Math.min(W*1.15,980);b.tr=z/2;b.tx=W/2;b.ty=H+z*.31}else b.tr=22*g}
    else if(b.i===fi){const z=Math.max(320,Math.min(.48*W,736));b.tr=z/2;b.tx=W-.18*z;b.ty=H-.05*z}
    else b.tr=(W>=1000?30:22)*(1+.25*b.glow);
  });
}
/* CURSOR MOMENTUM: moving the cursor across a planet drags it along.
   CURSOR_PUSH = strength, CURSOR_REACH = extra distance (px) around a planet
   that still counts as touching it, MAX_SPEED = fastest a planet may travel. */
const CURSOR_PUSH=9,CURSOR_REACH=26,MAX_SPEED=190;
const PLANET_GAP=34; // breathing room (px) kept between planets on the main map
const ptr={x:0,y:0,vx:0,vy:0,t:0,on:false};
addEventListener('pointermove',e=>{
  const now=performance.now(),dt=(now-ptr.t)/1000;
  if(ptr.on&&dt>0&&dt<.2){const lim=v=>Math.max(-1800,Math.min(1800,v));
    ptr.vx=lim(ptr.vx*.5+(e.clientX-ptr.x)/Math.max(dt,.008)*.5);ptr.vy=lim(ptr.vy*.5+(e.clientY-ptr.y)/Math.max(dt,.008)*.5)}
  ptr.x=e.clientX;ptr.y=e.clientY;ptr.t=now;ptr.on=true;
});
function physics(dt,t,group=bodies,area=bounds()){
  const isMain=group===bodies;if(isMain)group=group.filter(b=>!hidden(b));
  const bd=area,ccx=(bd.x0+bd.x1)/2,ccy=(bd.y0+bd.y1)/2;
  const motion=opt.momentum;
  const dm=Math.exp(-dt*(4.8/(1+1.6667*motion))),ka=mode==='home'?.4:mode==='events'?.6:1.2,wa=opt.drift?38*motion:0,fp=1-Math.exp(-dt*4.5),fw=1-Math.exp(-dt*6);
  group.forEach(b=>{
    b.pin=isMain&&mode!=='home'&&b.i===fi;
    if(b.pin){b.x+=(b.tx-b.x)*fp;b.y+=(b.ty-b.y)*fp;b.vx=b.vy=0;return}
    b.vx+=((ccx-b.x)*ka+Math.sin(t*.45+b.ph)*wa)*dt;
    b.vy+=((ccy-b.y)*ka+Math.cos(t*.4+b.ph*1.3)*wa)*dt;
    const px=b.x-ptr.x,py=b.y-ptr.y,reach=b.r+CURSOR_REACH;
    if(ptr.on&&px*px+py*py<reach*reach){b.vx+=ptr.vx*CURSOR_PUSH*motion*dt;b.vy+=ptr.vy*CURSOR_PUSH*motion*dt}
    b.vx*=dm;b.vy*=dm;
  });
  for(let p=0;p<2;p++)for(let i=0;i<group.length;i++)for(let j=i+1;j<group.length;j++){
    const a=group[i],c=group[j];
    if(mode==='focus'&&(a.pin||c.pin))continue;
    const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||.01,o=(a.r+c.r)*1.04+(mode==='home'?PLANET_GAP:mode==='events'?PLANET_GAP*.6:6)-d;

/* ACTIONS: the buttons a SUGGESTION can carry. A suggestion is a notice with "actions".
   Gemini picks ONLY the actions that fit the new data. Examples:
     a new SI session   -> ['add','dismiss']
     a campus event     -> ['interested','star','dismiss']
     homework due soon  -> ['start','remind']
   Each run() returns the confirmation line shown to the user.
   Every choice is sent to PA.report('suggestion',{id,action}). */
const ACTIONS={
  add:{label:'Add to my schedule',run:x=>{addSuggested(x);return'Added to your schedule.'}},
  interested:{label:'I’m interested',run:x=>{if(x.item)star(suggestedItem(x));return'Saved for later. Gemini will look for more like this.'}},
  star:{label:'Save for later',run:x=>{if(x.item)star(suggestedItem(x));return'Saved for later.'}},
  start:{label:'Start it now',run:x=>{setTimeout(()=>openNotice(x),0);return''}},
  remind:{label:'Remind me later',run:x=>{setTimeout(()=>{x.done='';x.archived=false;x.fresh=true;refresh();if(nprefs.popups)toast(x);bellMark()},REMIND_MS);return'Okay. This will pop up again later.'}},
  dismiss:{label:'Not interested',run:x=>{x.archived=true;return'Dismissed.'}}
};
const suggestedItem=x=>({...x.item,section:x.section||x.item.section});
function addSuggested(x){if(!x.item)return;const it=suggestedItem(x);if(SEC(it.section)&&!items.some(i=>i.id===it.id))PA.addItems([it]);x.itemId=it.id}
function star(it){if(!starred.some(e=>e.id===it.id)){starred.push({...it,section:'events',kind:it.kind==='important'?'important':'fun',when:new Date(it.when)});refresh()}}

/* NOTICE / SUGGESTION / POP-UP. Call PA.notify({id,title,body,section?,itemId?,item?,actions?,seconds?}).
   Returns null when Settings > Notifications has that kind turned off. */
function notify(n){
  const it=n.itemId&&items.find(i=>i.id===n.itemId),s=SEC(n.section||(it&&it.section)||(n.item&&n.item.section));
  const acts=(n.actions||[]).filter(a=>ACTIONS[a]);
  if(s&&nprefs.muted[s.slug])return null;
  if(acts.length&&!nprefs.suggestions)return null;
  const x={id:String(n.id||'notice-'+Date.now()+'-'+(notices.length+1)),title:String(n.title||'New notification'),body:String(n.body||''),section:s?s.slug:'',itemId:it?it.id:'',
    createdAt:n.createdAt||new Date().toISOString(),archived:false,item:n.item||null,actions:acts,seconds:+n.seconds||nprefs.seconds,tab:n.tab||'new',fresh:true,done:''};
  const existing=notices.find(o=>o.id===x.id);
  const record=existing?Object.assign(existing,x):x;
  if(!existing)notices.unshift(record);
  if(nwinOpen())renderNwin();else if(nprefs.popups)toast(record);
  bellMark();syncCounts();queueSave();return record;
}

function runAction(x,a){const msg=ACTIONS[a].run(x);x.done=msg;x.fresh=false;x.archived=!!msg;PA.report('suggestion',{id:x.id,action:a});bellMark();refresh();return msg}
/* the row of buttons under a notice: its actions, or a single Open button */
function actionRow(x,onDone,inWindow){
  const r=document.createElement('div');r.className='r';
  const btn=(label,fn)=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;r.appendChild(b)};
  if(x.actions.length)x.actions.forEach(a=>btn(ACTIONS[a].label,()=>onDone(runAction(x,a))));
  else if(x.itemId)btn('Open',()=>{onDone('');openNotice(x)});
  else if(!inWindow)btn('See notifications',()=>{onDone('');openNotice(x)});
  else if(x.tab!=='new')btn('Answer it',()=>{ntab=x.tab;notifWindow()});

}
/* POP-UP: the temporary card in the top right corner. It leaves after x.seconds. */
function toast(notice) {
  if (noticeIsPast(notice)) return;
  const tray = $('toast-stack');
  const existing = [...tray.children].find(card => card.dataset.noticeId === notice.id);
  if (existing) {existing.querySelector('b').textContent=notice.title;existing.querySelector('p').textContent=notice.body;return;} // Preserve its position and timer.
  if (tray.children.length >= 3) {
    overflowNotices.add(notice.id);
    updateOverflowBar();
    return; // Keep all three existing cards; extra notices become the bottom bar.
  }
  const card = document.createElement('div');
  card.className = 'toast';
  card.dataset.noticeId = notice.id;
  card.setAttribute('role', 'status');
  const section = SEC(notice.section);
  if (section) card.style.setProperty('--c', section.color);
  card.innerHTML = '<span class="tag">New</span><button class="x2" aria-label="Hide pop-up">&times;</button><b>' + esc(notice.title) + '</b><p>' + esc(notice.body) + '</p>';
  const dismiss = () => {
    if (card.classList.contains('leaving')) return;
    card.classList.add('leaving');
    setTimeout(() => {card.remove();updateOverflowBar();}, 340);
  };
  card.dismiss = dismiss;
  card.querySelector('.x2').onclick = dismiss; // Hiding a toast does not complete its item.
  card.appendChild(actionRow(notice, dismiss, false));
  tray.appendChild(card);
  setTimeout(dismiss, Math.min(60, Math.max(2, nprefs.seconds)) * 1000);
}

/* IMPORTANCE: section weight (WT) plus how close the item is in time. */
function importance(it){
  const s=SEC(it.section)||{verb:'Starts'},dh=(it.when-Date.now())/36e5,w=(WT[it.section]??8)+(priorities.classes[it.course]||0);
  return s.verb==='Received'||s.verb==='Posted'?w+60/(1+Math.max(0,-dh)/12):w+priorities.deadlines/(1+Math.max(0,dh)/24);

/* BUBBLE. Call PA.addBubble({slug,name,color,verb,blurb,items}). */
function addBubble(c){
  if(!c||!c.name||!HEX.test(c.color||''))throw new Error('A bubble needs a name and a #RRGGBB color.');
  let slug=String(c.slug||c.name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'bubble';
  while(SEC(slug))slug+='-2';
  const s={slug,name:String(c.name),color:c.color,color0:c.color,verb:['Due','Starts','Received','Posted'].includes(c.verb)?c.verb:'Starts',blurb:String(c.blurb||'')};
  sections.push(s);
  (c.items||[]).forEach(x=>items.push(cleanItem(x,slug)));
  addBody(s);syncCounts();buildDev();setMode('home');
  return s;

/* ---------- calendar export (Gemini task: 'calendar') ---------- */
const icsEsc=s=>String(s).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function icsText(list,prefix){
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const ev=list.map(i=>{const s=SEC(i.section)||{name:i.section==='imported'?'Imported':'Class'};
    return['BEGIN:VEVENT','UID:'+i.id+'@headspace','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'),'DTSTART:'+f(i.when),'DTEND:'+f(scheduleEnd(i)),
      'SUMMARY:'+icsEsc((prefix?s.name+': ':'')+i.title),'DESCRIPTION:'+icsEsc(i.course+'. '+i.detail),'LOCATION:'+icsEsc(i.place),'END:VEVENT'].join('\r\n')});
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HeadSpace//EN',...ev,'END:VCALENDAR'].join('\r\n');
}

/* ---------- event swipes (Gemini task: 'discover', the Event Scout) ----------
   The Events planet sits at the bottom, one event card sits in the middle,
   and the other planets float dimmed in the background.
   Drag the card, or use the explicit Pass / Add to schedule buttons. Empty space is inert.
   Every choice goes to PA.report('swipe',{id,title,kind,choice}) so Gemini learns your taste.
   Start it with PA.startSwipes('fun'|'important', searchWords). Feed it with PA.offerEvents([...]). */
const scout=[];              // every event offered so far
const swiped=new Set();      // ids already answered
let deck=[],dkind='fun',dlive=false,busy=false,discoverRequest=0;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function offerEvents(list){
  (list||[]).forEach(e=>{if(!e||!e.id||!e.title||scout.some(s=>s.id===e.id))return;
    let w=new Date(e.when);if(isNaN(w))w=on(3,18);
    scout.push({id:String(e.id),title:String(e.title),course:String(e.course||''),when:w,place:String(e.place||''),source:String(e.source||'Gemini'),detail:String(e.detail||''),tags:(e.tags||[]).map(String),kind:e.kind==='important'?'important':'fun'})});
}
async function startSwipes(kind,query,test){
  const i=bodies.findIndex(b=>b.sec.slug==='events');if(i<0)return;
  const request=++discoverRequest;
  dkind=kind==='important'?'important':'fun';
  closeModal();closePop();setMode('discover',i);
  $('dcard').innerHTML='<div class="dc"><p>Looking for events...</p></div>';$('dcount').textContent='';
  const r=await GEMINI.run('discover',{kind:dkind,query:query||''});
  if(request!==discoverRequest||mode!=='discover')return;
  dlive=r.live;
  offerEvents(Array.isArray(r.data)?r.data:[]);
  const words=String(query||'').toLowerCase().split(/[\s,]+/).filter(Boolean);
  const hits=e=>words.filter(w=>(e.title+' '+e.detail+' '+e.tags.join(' ')).toLowerCase().includes(w)).length;
  deck=scout.filter(e=>e.kind===dkind&&(test||(!swiped.has(e.id)&&!starred.some(s=>s.id===e.id)&&!items.some(it=>it.id===e.id)))).sort((a,b)=>hits(b)-hits(a));
  if(mode!=='discover')return;
  busy=false;deck=sorted(deck,sortOrders.eventsSwipe||'soonest');
  $('event-sort').innerHTML=sortControl('eventsSwipe',sortOrders.eventsSwipe||'soonest');showCard();
}
function endSwipes(){discoverRequest++;evKind=dkind;setMode('focus',bodies.findIndex(b=>b.sec.slug==='events'))}
function showCard(){
  const box=$('dcard'),e=deck[0],c=document.createElement('div');c.className='dc';
  const s=SEC('events');if(s)c.style.setProperty('--c',s.color);

/* ---------- pointer dragging for event cards ----------
   Use Pointer Events so mouse, pen and touch share one implementation.
   Cancellation springs back without recording a decision. Buttons remain clicks. */
function wireEventDrag(card){
  let drag=null;
  card.onpointerdown=e=>{
    if(e.button!==0||e.target.closest('button')||busy)return;
    card.getAnimations().forEach(a=>a.cancel());
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0};
    card.setPointerCapture(e.pointerId);$('dcard').classList.add('dragging');
  };
  card.onpointermove=e=>{
    if(!drag||drag.id!==e.pointerId)return;
    drag.dx=e.clientX-drag.x;
    card.style.transform='translateX('+drag.dx+'px) rotate('+(drag.dx/22)+'deg)';
  };
  const end=(e,cancel)=>{
    if(!drag||drag.id!==e.pointerId)return;
    const dx=drag.dx;drag=null;$('dcard').classList.remove('dragging');
    if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);
    if(!cancel&&Math.abs(dx)>Math.min(90,innerWidth*.18))choose(dx<0?'pass':'interested');
    else{const from=card.style.transform;card.style.transform='';if(!RM)card.animate([{transform:from},{transform:'none'}],{duration:220,easing:'ease-out'})}
  };
  card.onpointerup=e=>end(e,false);card.onpointercancel=e=>end(e,true);
}

/* ---------- workload: suggestions, opt-in actions, independent hover slots ----------
   PA.offerRecommendations([{id,title,reason,course,item}]) accepts Gemini results.
   item uses the normal Item fields with optional end. It is scheduled ONLY on Yes.
   PA.report('recommendation', {id,accepted,...}) records both Yes and No.
   Each bubble has its own CSS grid slot. Hover enlarges it; gentle CSS floating
   is independent of the main planet momentum slider. */
const lastClassAnswers={};
const recommendations=[],recommendationDecisions=new Set(),workBodies=[];
function offerRecommendations(list){
  list.forEach(r=>{
    if(!r.id||!r.title||!r.item||recommendations.some(x=>x.id===r.id)||recommendationDecisions.has(r.id))return;
    const when=new Date(r.item.when),end=r.item.end?new Date(r.item.end):new Date(+when+60*6e4);
    if(!Number.isFinite(+when)||!Number.isFinite(+end)||end<=when)return;
    recommendations.push({...r,id:String(r.id),item:{...r.item,when,end}});
  });
  updateWorkloadCount();if(mode==='recommend')renderWorkload();
}
PA.offerRecommendations=offerRecommendations;
function buildRecommendations(answer={}) {
  if(answer.course)lastClassAnswers[answer.course]=answer;
  // Regenerate only our local study blocks; preserve Gemini-provided suggestions.
  for(let i=recommendations.length-1;i>=0;i--)if(recommendations[i].id.startsWith('early-'))recommendations.splice(i,1);
  const now=new Date();
  const deadlines=sorted(items.filter(item=>!DONE.has(item.id)&&item.when>now&&(SEC(item.section)?.verb==='Due'||item.section==='exams')),'priority');
  const proposals=[];
  const reserved=scheduleItems(true).slice();
  if(answer.confidence&&answer.confidence<=2){
    const session=items.filter(item=>item.section==='si-sessions'&&item.course===answer.course&&item.when>now&&!DONE.has(item.id)).sort((a,b)=>a.when-b.when)[0];
    if(session)proposals.push({id:'help-'+session.id,title:'Try a study support session',course:session.course,reason:'You rated '+answer.topic+' '+answer.confidence+'/5. '+session.title+' starts '+dateLabel(session.when)+' at '+clock(session.when)+'.',item:session});
  }
  deadlines.forEach(deadline=>{
    const id='early-'+deadline.id;
    if(recommendationDecisions.has(id))return;
    const response=lastClassAnswers[deadline.course]||{};
    const count=deadlines.filter(item=>sameDay(item.when,deadline.when)).length;
    const slow=response.pace==='longer',soon=deadline.when-now<72*36e5;
    if(!slow&&count<2&&!soon)return;
    const minutes=slow?90:60;
    const start=findStudySlot(deadline.when,minutes,reserved,now);
    if(!start)return;
    const study={id:'study-'+deadline.id,section:'homework',title:'Study: '+deadline.title,course:deadline.course,when:start,end:new Date(+start+minutes*6e4),detail:'Early work for '+deadline.title,source:'Workload recommendation',place:''};
    reserved.push(study); // Later suggestions must not overlap this proposal.
    proposals.push({id,title:deadline.section==='exams'?'Review before the exam':'Get a head start',course:deadline.course,reason:deadline.title+'. '+(count>1?count+' deadlines on '+dateLabel(deadline.when)+'. ':'Due '+dateLabel(deadline.when)+'. ')+(slow?'You said this work takes longer. ':'')+minutes+' min · '+dateLabel(start)+' · '+clock(start)+'.',item:study});
  });
  offerRecommendations(proposals);
  queueSave();
}
function updateWorkloadCount(){if(appReady)syncCounts()}
function openWorkload(){buildRecommendations();setMode('recommend',bodies.findIndex(b=>b.sec.slug==='workload'))}

function decideRecommendation(r,accepted){
  if(recommendationDecisions.has(r.id))return;
  if(accepted){
    // An SI already on the schedule is confirmed without creating a duplicate.
    if(!scheduleItems(true).some(i=>i.id===r.item.id)){
      if(r.item.when<new Date()||scheduleItems(true).some(i=>r.item.when<scheduleEnd(i)&&r.item.end>i.when)){
        buildRecommendations();renderWorkload();notify({title:'Schedule changed',body:'Please review the updated time before accepting this suggestion.'});return;
      }
      studyBlocks.push({...r.item});
    }
    momentum(r.course||r.item.course||'');
  }
  recommendationDecisions.add(r.id);recommendations.splice(recommendations.indexOf(r),1);
  PA.report('recommendation',{id:r.id,title:r.title,accepted,course:r.course,itemId:r.item.id});
  buildRecommendations();refresh();renderWorkload();
  notify({id:'decision-'+r.id,title:accepted?'Added to your plan':'Suggestion declined',body:accepted?r.item.title:'Your schedule has not changed.'});
}

/* =====================================================================
   HEADSPACE: SHARED STATE AND PREFERENCES

   Read this map before changing the app:
   - items + DONE hold work and its completion state.
   - notices hold messages/suggestions; notificationRecords() deduplicates them.
   - syncCounts() derives the title, bell, numeric planet labels and orbits.
   - setItemDone() is the single command for completing/reopening an item.
   - scheduleItems() is shared by the calendar and calendar export.
   - recommendations are proposals; decideRecommendation() commits Yes only.
   - localStorage saves browser preferences/state; credentials are never saved.
   - workload layout is CSS-only. physics() belongs to the main planets only.

   Internal event kinds remain 'fun' and 'important' for Gemini compatibility.
   Labels are intentionally separate from those API identifiers.
   ===================================================================== */

/* Sorting: one predictable set of choices for every content list.
   Calendar days themselves always stay chronological; its agenda can be sorted. */
function compareEntries(a,b,order) {
  const title=item=>String(item.title||item.name||'');
  const course=item=>String(item.course||'');
  const when=item=>+new Date(item.when||item.createdAt||0)||0;
  if(order==='title')return title(a).localeCompare(title(b));
  if(order==='course')return course(a).localeCompare(course(b))||when(a)-when(b);
  if(order==='latest')return when(b)-when(a);
  if(order==='priority')return importance({...b,when:new Date(when(b))})-importance({...a,when:new Date(when(a))})||when(a)-when(b);
  return when(a)-when(b);
}
function sorted(list,order='soonest'){return [...list].sort((a,b)=>compareEntries(a,b,order));}

}

/* Notification records are derived, never separately counted.
   A notice pointing to an item is folded into that item so one task = one dot. */
function noticeIsPast(notice) {
  return !!(notice.archived||notice.done||(notice.itemId&&DONE.has(notice.itemId)));
}
function allTasks(){return [...items,...studyBlocks.filter(block=>!items.some(item=>item.id===block.id))];}
function notificationRecords() {
  const records=allTasks().map(item=>{
    const linked=notices.find(notice=>notice.itemId===item.id);
    return {id:'item:'+item.id,kind:'item',item,notice:linked,title:item.title,course:item.course,body:linked?.body||item.detail,section:item.section,when:item.when,closed:DONE.has(item.id)};
  });
  notices.forEach(notice=>{
    if(notice.itemId&&allTasks().some(item=>item.id===notice.itemId))return;
    records.push({id:'notice:'+notice.id,kind:'notice',notice,title:notice.title,course:notice.item?.course||'',body:notice.body,section:notice.section||'announcements',when:new Date(notice.createdAt||NOW),closed:noticeIsPast(notice)});
  });
  recommendations.forEach(recommendation=>records.push({id:'recommendation:'+recommendation.id,kind:'recommendation',recommendation,title:recommendation.title,course:recommendation.course,body:recommendation.reason,section:'workload',when:recommendation.item.when,closed:false}));
  return records.filter(record=>!nprefs.muted[record.section]);
}

}

/* Stress Days: a workload estimate, not a medical stress measurement.
   Due work/exams contribute their priority. Class meetings and appointments
   contribute smaller duration-based weights. Completed items contribute zero. */
const stressSchemes={
  nebula:{label:'Nebula',colors:['#193b4b','#7856a1','#ef6c85']},
  sunset:{label:'Sunset',colors:['#204957','#b57836','#e75745']},
  ocean:{label:'Ocean',colors:['#173e59','#4969b7','#c363df']}
};
const stressPrefs={scheme:'nebula',custom:['#193b4b','#7856a1','#ef6c85']};
function stressColors(){return stressPrefs.scheme==='custom'?stressPrefs.custom:stressSchemes[stressPrefs.scheme].colors;}
function dayStress(date) {
  const load=scheduleItems(false).filter(item=>sameDay(item.when,date)).reduce((sum,item)=>{
    if(DONE.has(item.id))return sum;
    const minutes=(scheduleEnd(item)-item.when)/6e4;
    const deadline=!item.end&&(SEC(item.section)?.verb==='Due'||item.section==='exams');
    const weight=deadline?importance(item):Math.max(5,minutes*.22)+(priorities.classes[item.course]||0);
    return sum+weight;
  },0);
  return Math.min(1,load/300);
}
function stressColor(value) {
  const colors=stressColors(),t=Math.max(0,Math.min(1,value));
  return t<.5?mix(colors[0],colors[1],t*2):mix(colors[1],colors[2],(t-.5)*2);
}
PANES.calendar=pane=>{
  pane.innerHTML='<h4>Stress Days colors</h4><p class="mut">Days become more intense as open work accumulates, with larger weights for high-priority deadlines and classes. A numeric workload score is shown too.</p><label class="fl">Color scheme<select id="stress-scheme">'+Object.entries(stressSchemes).map(([key,value])=>'<option value="'+key+'"'+(stressPrefs.scheme===key?' selected':'')+'>'+value.label+'</option>').join('')+'<option value="custom"'+(stressPrefs.scheme==='custom'?' selected':'')+'>Custom</option></select></label><div class="stress-custom">'+['Light day','Moderate day','Busy day'].map((label,i)=>'<label>'+label+'<input type="color" data-stress-color="'+i+'" value="'+stressPrefs.custom[i]+'"></label>').join('')+'</div><div class="stress-key"><span>Light</span><i id="stress-preview"></i><span>Busy</span></div><p class="mut">Adjust priority weights in Priority preferences to change how your workload is calculated.</p>';
  const preview=()=>{$('stress-preview').style.background='linear-gradient(90deg,'+stressColors().join(',')+')';if($('schedule').classList.contains('open'))renderCalendar();queueSave();};
  $('stress-scheme').onchange=event=>{stressPrefs.scheme=event.target.value;preview();};
  pane.querySelectorAll('[data-stress-color]').forEach(input=>input.oninput=()=>{stressPrefs.custom[+input.dataset.stressColor]=input.value;stressPrefs.scheme='custom';$('stress-scheme').value='custom';preview();});
  preview();
};

/* Propose an available block before its deadline. Score days by current load,
   use daylight hours, leave 15-minute gaps and limit proposed study to 3 h/day. */
function findStudySlot(deadline,minutes,reserved,now=new Date()) {
  let candidate=new Date(Math.ceil((+now+30*6e4)/(30*6e4))*30*6e4);
  let best=null,bestScore=Infinity;
  const horizon=Math.min(+deadline,+now+14*864e5),duration=minutes*6e4,gap=15*6e4;
  while(+candidate+duration<horizon){
    const end=new Date(+candidate+duration);
    const daytime=candidate.getHours()>=8&&sameDay(candidate,end)&&(end.getHours()<22||(end.getHours()===22&&end.getMinutes()===0));
    const collision=reserved.some(item=>+candidate<+scheduleEnd(item)+gap&&+end>+item.when-gap);
    const studyMinutes=reserved.filter(item=>item.source==='Workload recommendation'&&sameDay(item.when,candidate)).reduce((sum,item)=>sum+(scheduleEnd(item)-item.when)/6e4,0);
    if(daytime&&!collision&&studyMinutes+minutes<=180){
      const score=dayStress(candidate)*100+Math.floor((sod(candidate)-sod(now))/864e5)*5+studyMinutes/6;
      if(score<bestScore){best=new Date(candidate);bestScore=score;}
    }
    candidate=new Date(+candidate+30*6e4);
  }
  return best;
}

/* Browser persistence. Save one versioned snapshot so all counts and menus
   restore together. Never serialize Canvas tokens, file attachments or APIs.
   Preferences are per-browser; the Python wrapper does not upload them. */
const STORAGE_KEY='headspace.snapshot.v1';
let saveTimer=null,restoring=false,storageWarningShown=false;
function queueSave() {
  if(!appReady||restoring)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(saveSnapshot,120);
}
function snapshotData() {
  return {version:1,preferences:{opt,prefs,nprefs,priorities,weights:WT,theme,evKind,sortOrders,stressPrefs,calendarIncludeDone,calendarTab,bgPhoto,sections},state:{items,courses,past,done:[...DONE],notices,starred,studyBlocks,calendarImports,classSessions,classScheduleIsSample,decisions:[...recommendationDecisions],recommendations,lastClassAnswers,answers:PA.outbox,swiped:[...swiped],surveyAnswers,note:nodes.notes.querySelector('#nt').value}};
}
function saveSnapshot() {
  if(!appReady||restoring)return;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshotData()));}
  catch(error){
    if(!storageWarningShown){storageWarningShown=true;notify({id:'storage-warning',title:'Preferences could not be saved',body:'Browser storage is unavailable or full. Try smaller photos or allow local storage.'});}
  }
}
function dated(item) {
  const result={...item,when:new Date(item.when)};
  if(item.end)result.end=new Date(item.end);
  return result;
}
function restoreSavedData(raw=null) {
  restoring=true;
  try{
    const data=JSON.parse(raw===null?localStorage.getItem(STORAGE_KEY):raw);
    if(!data||data.version!==1)return;
    const p=data.preferences||{},state=data.state||{};
    if(p.opt)Object.assign(opt,p.opt);
    opt.momentum=Math.max(0,Math.min(2,Number(opt.momentum)||0));if(!Array.isArray(opt.hidden))opt.hidden=[];
    if(p.prefs)Object.assign(prefs,p.prefs);
    if(p.nprefs)Object.assign(nprefs,p.nprefs);if(!nprefs.secondsSet)nprefs.seconds=5;
    if(p.priorities)Object.assign(priorities,p.priorities);
    if(p.weights)Object.assign(WT,p.weights);
    if(p.sortOrders)Object.assign(sortOrders,p.sortOrders);
    if(p.stressPrefs){stressPrefs.scheme=stressSchemes[p.stressPrefs.scheme]||p.stressPrefs.scheme==='custom'?p.stressPrefs.scheme:'nebula';if(p.stressPrefs.custom?.length===3&&p.stressPrefs.custom.every(c=>HEX.test(c)))stressPrefs.custom=p.stressPrefs.custom;}
    if(THEMES.some(([key])=>key===p.theme))theme=p.theme;
    evKind=p.evKind==='important'?'important':'fun';bgPhoto=p.bgPhoto||'';
    calendarIncludeDone=!!p.calendarIncludeDone;calendarTab=p.calendarTab==='recommended'?'recommended':'calendar';
    if(Array.isArray(p.sections))p.sections.forEach(saved=>{
      if(!saved.slug||!saved.name||!HEX.test(saved.color))return;
      const existing=SEC(saved.slug);
      if(existing)Object.assign(existing,saved);else sections.push(saved);
    });
    const restoreList=(target,list,convert=x=>x)=>{if(Array.isArray(list)){target.length=0;list.forEach(item=>target.push(convert(item)));}};
    restoreList(items,state.items,dated);restoreList(notices,state.notices);
    if(Array.isArray(state.courses))courses=state.courses;
    if(Array.isArray(state.past))past=state.past.map(dated);
    restoreList(starred,state.starred,dated);restoreList(studyBlocks,state.studyBlocks,dated);restoreList(calendarImports,state.calendarImports,dated);
    if(Array.isArray(state.classSessions))classSessions=state.classSessions.map(dated);
    classScheduleIsSample=state.classScheduleIsSample!==false;
    const restoreSet=(target,list)=>{if(Array.isArray(list)){target.clear();list.forEach(id=>target.add(id));}};
    restoreSet(DONE,state.done);restoreSet(swiped,state.swiped);restoreSet(recommendationDecisions,state.decisions);
    restoreList(recommendations,state.recommendations,r=>({...r,item:dated(r.item)}));
    if(state.lastClassAnswers)Object.assign(lastClassAnswers,state.lastClassAnswers);
    if(state.surveyAnswers)Object.assign(surveyAnswers,state.surveyAnswers);
    restoreList(PA.outbox,state.answers);
    nodes.notes.querySelector('#nt').value=state.note||'';
    // Answered class meetings should not ask again after a reload.
    classCheckins.clear();PA.outbox.filter(a=>a.type==='checkin').forEach(a=>classCheckins.add(a.data.id));
  }catch(error){console.warn('Ignoring an unreadable HeadSpace save.',error);}
  finally{restoring=false;}
}

function parseCsv(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function calEvent(title,when,end,place,detail,uid){
  const t=String(title||'Untitled event').trim();
  return{id:'import-'+String(uid||t+'-'+when.getTime()).replace(/[^\w-]/g,'').slice(0,80),section:'imported',title:t,course:'Imported calendar',when,end,place:String(place||'').trim(),source:'Imported file',detail:String(detail||'').trim()};
}
function parseCalendarCsv(text){
  const rows=parseCsv(text);if(rows.length<2)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase()),col=(...n)=>head.findIndex(h=>n.includes(h));
  const iT=col('subject','title','summary','name','event'),iSD=col('start date','date','start'),iST=col('start time'),iED=col('end date'),iET=col('end time'),iL=col('location','place'),iD=col('description','details','notes');
  if(iT<0||iSD<0)return[];
  return rows.slice(1).map(r=>{
    const when=new Date((r[iSD]||'')+' '+(iST>=0&&r[iST]?r[iST]:'9:00 AM'));if(isNaN(when))return null;
    let end=iED>=0&&r[iED]?new Date(r[iED]+' '+(iET>=0&&r[iET]?r[iET]:'')):null;
    if(!end||isNaN(end)||end<=when)end=new Date(+when+36e5);
    return calEvent(r[iT],when,end,iL>=0?r[iL]:'',iD>=0?r[iD]:'');
  }).filter(Boolean);
}
function parseIcs(text){
  const lines=text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/),out=[];let ev=null;
  const unesc=v=>v.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
  const dt=v=>{const m=/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?)?(Z)?$/.exec(v.trim());if(!m)return null;const a=[+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)];return m[7]?new Date(Date.UTC(...a)):new Date(...a)};
  lines.forEach(line=>{
    if(line==='BEGIN:VEVENT'){ev={};return}
    if(line==='END:VEVENT'){
      if(ev&&ev.SUMMARY&&ev.DTSTART){const when=dt(ev.DTSTART);if(when){let end=ev.DTEND?dt(ev.DTEND):null;if(!end||end<=when)end=new Date(+when+36e5);out.push(calEvent(unesc(ev.SUMMARY),when,end,unesc(ev.LOCATION||''),unesc(ev.DESCRIPTION||''),ev.UID))}}
      ev=null;return}
    if(!ev)return;const i=line.indexOf(':');if(i<0)return;ev[line.slice(0,i).split(';')[0].toUpperCase()]=line.slice(i+1);
  });
  return out;
}
async function importCalendarFiles(fs){
  let added=0,first=null;
  for(const f of fs){
    let text='';try{text=await f.text()}catch(e){continue}
    const list=/\.ics$/i.test(f.name)||/BEGIN:VCALENDAR/i.test(text)?parseIcs(text):parseCalendarCsv(text);
    list.forEach(e=>{if(!calendarImports.some(x=>x.id===e.id)){calendarImports.push(e);added++;if(!first||e.when<first.when)first=e}});
  }
  PA.report('calendar-import',{files:fs.map(f=>f.name),added});
  if(first){calendarMonth=new Date(first.when.getFullYear(),first.when.getMonth(),1);calendarDate=sod(first.when);}
  refresh();
  notify({title:added?'Calendar updated':'Nothing new to add',body:added?added+' event'+(added===1?'':'s')+' from your file '+(added===1?'is':'are')+' now in your calendar and export.':'No new events were found in that file.'});
  if(added){closePop();openSchedule()}
}
